# ─── FlowDay AI Worker — wrangler.toml ───────────────────────────────────────
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "flowday-ai"
main = "src/index.js"

# Use the latest Workers runtime
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Workers Free plan handles ~100k requests/day — upgrade to Paid if you need more
# account_id = "YOUR_ACCOUNT_ID"   # optional: wrangler will auto-detect from login


# ─── Environment variables (non-secret) ──────────────────────────────────────
# Set OPENAI_API_KEY as a SECRET — never put it here:
#   wrangler secret put OPENAI_API_KEY
#
# Optional: restrict which origins can call this worker.
# Comma-separated list of allowed origins. Leave blank to allow all.
[vars]
ALLOWED_ORIGIN = "https://flowday.app,https://www.flowday.app,https://axinote.ethansoh.com"
# During development, also allow localhost:
# ALLOWED_ORIGIN = "https://flowday.app,http://localhost:5500,http://127.0.0.1:5500"


# ─── Production environment ──────────────────────────────────────────────────
[env.production]
name = "flowday-ai"

[env.production.vars]
ALLOWED_ORIGIN = "https://flowday.app,https://www.flowday.app,https://axinote.ethansoh.com"


# ─── Staging / preview environment ───────────────────────────────────────────
[env.staging]
name = "flowday-ai-staging"

[env.staging.vars]
ALLOWED_ORIGIN = ""   # allow all origins in staging


# ─── Routes ──────────────────────────────────────────────────────────────────
# Uncomment and fill in if you want to serve the worker on a custom domain:
# [[routes]]
# pattern = "axinote.ethansoh.com/api/*"
# zone_name = "ethansoh.com"


# ─── Observability ───────────────────────────────────────────────────────────
[observability]
enabled = true          # enables Workers Logs in the Cloudflare dashboard
